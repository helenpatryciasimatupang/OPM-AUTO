<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPM GO V11</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="box">
    <h2>OPM GO V11</h2>
    <p class="small">Mode cepat: ambil file Excel hasil jadi dari ZIP area bila tersedia.</p>

    <label>Template Excel (opsional untuk mode ini)</label>
    <input id="excel" type="file" accept=".xlsx" />

    <label>ZIP Area</label>
    <input id="zip" type="file" accept=".zip" />

    <button id="btn">PROCESS</button>

    <p id="status">READY</p>
    <a id="download" style="display:none">DOWNLOAD RESULT</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
