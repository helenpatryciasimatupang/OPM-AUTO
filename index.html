<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPM GO V14.1 FIX</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0}
.box{background:#fff;max-width:560px;margin:50px auto;padding:30px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
label{display:block;margin-top:16px;margin-bottom:6px;font-weight:600}
input{display:block;width:100%;box-sizing:border-box}
button{margin-top:20px;padding:10px 18px;font-size:16px;cursor:pointer}
#status{margin-top:18px;white-space:pre-wrap}
#download{display:none;margin-top:12px;font-weight:700}
.ver{font-size:12px;color:#666}
</style>
</head>
<body>
<div class="box">
<h2>OPM GO V14.1 FIX</h2>
<div class="ver">Build: V14.1-inline-2026-10-02</div>

<label>Excel Master (hasil manual yang sudah benar)</label>
<input id="master" type="file" accept=".xlsx">

<label>ZIP Foto Area</label>
<input id="zip" type="file" accept=".zip">

<button id="generateBtn" type="button">GENERATE</button>

<p id="status">READY</p>
<a id="download">DOWNLOAD RESULT</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){
  const statusEl = document.getElementById("status");
  const downloadEl = document.getElementById("download");
  const btn = document.getElementById("generateBtn");

  function setStatus(msg){ statusEl.textContent = msg; }

  btn.addEventListener("click", async function(){
    downloadEl.style.display = "none";
    setStatus("Tombol bekerja. Memulai proses...");

    try{
      if(typeof JSZip === "undefined"){
        throw new Error("Library JSZip gagal dimuat. Refresh halaman lalu coba lagi.");
      }

      const master = document.getElementById("master").files[0];
      const zipFile = document.getElementById("zip").files[0];

      if(!master || !zipFile){
        throw new Error("Pilih Excel Master dan ZIP Foto Area terlebih dahulu.");
      }

      setStatus("Membaca Excel Master...");
      const xlsx = await JSZip.loadAsync(await master.arrayBuffer());

      setStatus("Membaca ZIP Foto...");
      const photos = await JSZip.loadAsync(await zipFile.arrayBuffer());

      let count = 0;
      for(const name of Object.keys(photos.files)){
        if(!photos.files[name].dir && /\.(jpg|jpeg|png)$/i.test(name)) count++;
      }

      setStatus("Foto ditemukan: " + count + "\nMembuat file hasil...");

      // V14.1 test: mempertahankan file master apa adanya agar valid.
      const result = await xlsx.generateAsync({
        type:"blob",
        mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        compression:"DEFLATE"
      });

      const oldUrl = downloadEl.dataset.url;
      if(oldUrl) URL.revokeObjectURL(oldUrl);

      const url = URL.createObjectURL(result);
      downloadEl.dataset.url = url;
      downloadEl.href = url;
      downloadEl.download = "OPM_RESULT_V14_1.xlsx";
      downloadEl.style.display = "inline-block";

      setStatus("SELESAI\nFoto terdeteksi: " + count + "\nKlik DOWNLOAD RESULT.");
    }catch(err){
      console.error(err);
      setStatus("ERROR: " + (err && err.message ? err.message : String(err)));
    }
  });
})();
</script>
</body>
</html>
