<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OPM GO Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>OPM GO Generator</h1>

<script src="script.js"></script>
</body>
</html>
