<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OPM GO V14 Master Template</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
<h2>OPM GO V14 Master Template</h2>

<label>Excel Master (hasil manual yang sudah benar)</label>
<input id="master" type="file" accept=".xlsx">

<label>ZIP Foto Area</label>
<input id="zip" type="file" accept=".zip">

<button onclick="generate()">GENERATE</button>

<p id="status">READY</p>
<a id="download" style="display:none">DOWNLOAD RESULT</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
<script src="script.js"></script>
</body>
</html>
